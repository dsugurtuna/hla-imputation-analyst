[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hla-imputation-analyst"
version = "1.1.0"
description = "Health checks and batch comparison for SNP2HLA/Beagle HLA imputation run directories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ugur Tuna" }]
keywords = ["bioinformatics", "HLA", "imputation", "SNP2HLA", "Beagle", "quality-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "mypy>=1.11"]

[project.scripts]
hla-analyst = "hla_analyst.cli:app"

[project.urls]
Homepage = "https://github.com/dsugurtuna/hla-imputation-analyst"
Issues = "https://github.com/dsugurtuna/hla-imputation-analyst/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hla_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "--strict-markers", "-ra"]

[tool.ruff]
target-version = "py311"
line-length = 88
# legacy/ holds the original shell script, kept as published for reference.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
