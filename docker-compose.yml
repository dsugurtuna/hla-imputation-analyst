version: "3.9"

# =============================================================================
# HLA Imputation Analyst - Docker Compose Configuration
# Supports development, testing, and production environments
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main Application Service
  # ---------------------------------------------------------------------------
  hla-analyst:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: hla-imputation-analyst:latest
    container_name: hla-analyst
    volumes:
      - ./data:/data:ro                    # Input data (read-only)
      - ./output:/output:rw                # Output reports
      - ./logs:/logs:rw                    # Application logs
      - ./config:/app/config:ro            # Configuration files
    environment:
      - HLA_ANALYST_LOG_LEVEL=INFO
      - HLA_ANALYST_OUTPUT_FORMAT=json
      - TZ=Europe/London
    user: "1000:1000"
    restart: "no"
    networks:
      - hla-network
    healthcheck:
      test: ["CMD", "hla-analyst", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Development Service (with hot-reload)
  # ---------------------------------------------------------------------------
  hla-analyst-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hla-imputation-analyst:dev
    container_name: hla-analyst-dev
    volumes:
      - .:/app:rw                          # Full source mount
      - ./data:/data:ro
      - ./output:/output:rw
    environment:
      - HLA_ANALYST_LOG_LEVEL=DEBUG
      - HLA_ANALYST_ENV=development
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8080:8080"                        # Documentation server
    working_dir: /app
    command: ["python", "-m", "hla_analyst", "--help"]
    profiles:
      - dev
    networks:
      - hla-network

  # ---------------------------------------------------------------------------
  # Test Runner Service
  # ---------------------------------------------------------------------------
  hla-analyst-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hla-imputation-analyst:test
    container_name: hla-analyst-test
    volumes:
      - .:/app:ro
      - ./test-results:/test-results:rw
    environment:
      - HLA_ANALYST_ENV=testing
      - COVERAGE_FILE=/test-results/.coverage
    command: ["pytest", "tests/", "-v", "--cov=src/hla_analyst", "--cov-report=xml:/test-results/coverage.xml"]
    profiles:
      - test
    networks:
      - hla-network

  # ---------------------------------------------------------------------------
  # Documentation Server
  # ---------------------------------------------------------------------------
  docs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hla-imputation-analyst:docs
    container_name: hla-analyst-docs
    volumes:
      - ./docs:/app/docs:ro
      - ./mkdocs.yml:/app/mkdocs.yml:ro
    ports:
      - "8000:8000"
    command: ["mkdocs", "serve", "-a", "0.0.0.0:8000"]
    profiles:
      - docs
    networks:
      - hla-network

networks:
  hla-network:
    driver: bridge
    name: hla-imputation-network

volumes:
  output-data:
    driver: local
  log-data:
    driver: local

# =============================================================================
# Usage:
#
# Production analysis:
#   docker-compose run --rm hla-analyst analyze /data/batch_001
#
# Development mode:
#   docker-compose --profile dev up hla-analyst-dev
#
# Run tests:
#   docker-compose --profile test run --rm hla-analyst-test
#
# Serve documentation:
#   docker-compose --profile docs up docs
# =============================================================================
